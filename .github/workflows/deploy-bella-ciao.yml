name: Deploy Bella Ciao

on:
  push:
    branches:
      - main
      - cursor/bella-ciao-pizza-d2e0
    paths:
      - "bella-ciao-pizza/**"
      - ".github/workflows/deploy-bella-ciao.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bella-ciao-pizza/package-lock.json
      - name: Deploy to mjl-bella-ciao-pizza
        working-directory: bella-ciao-pizza
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is not set in GitHub secrets"
            exit 1
          fi
          npx vercel deploy --prod --yes --name mjl-bella-ciao-pizza --token="$VERCEL_TOKEN"
