name: GitHub Pages

on:
  push:
    branches:
      - cursor/commonwealth-group-redesign-1100
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: commonwealth-group/package-lock.json
      - name: Build static preview
        working-directory: commonwealth-group
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: commonwealth-group/out
      - id: deployment
        uses: actions/deploy-pages@v4
